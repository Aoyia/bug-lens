<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web Bug Recorder</title><style>
*{box-sizing:border-box}body{margin:0;width:360px;background:#f7f8fa;color:#182230;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{padding:20px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}.mark{width:34px;height:34px;border-radius:10px;background:#172b4d;color:#fff;display:grid;place-items:center;font-weight:700}.brand h1{font-size:17px;margin:0}.brand p{margin:2px 0 0;color:#697586;font-size:12px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 3px 12px #1018280a}.label{font-size:11px;color:#697586;text-transform:uppercase;letter-spacing:.08em}.target{font-weight:600;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.url{color:#697586;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row{display:flex;justify-content:space-between;align-items:center;margin:12px 0}.field{display:flex;align-items:center;gap:8px}.actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:16px}button{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:600;cursor:pointer}button.primary{background:#1769e0;color:#fff}button.stop{background:#d92d20;color:#fff}button.secondary{background:#eef2f7;color:#344054}button:disabled{opacity:.5;cursor:not-allowed}.status{display:flex;align-items:center;gap:8px;color:#475467}.dot{width:8px;height:8px;border-radius:50%;background:#98a2b3}.dot.rec{background:#d92d20;box-shadow:0 0 0 4px #d92d201a}.hint{font-size:12px;color:#697586;margin:10px 0 0}.error{color:#b42318;font-size:12px;margin-top:8px;white-space:pre-wrap}
</style></head><body><main class="shell"><header class="brand"><div class="mark">WB</div><div><h1>Web Bug Recorder</h1><p>本地采集，可控导出</p></div></header><section class="card"><div class="label">目标标签页</div><div id="title" class="target">正在读取…</div><div id="url" class="url"></div><div class="row"><div class="status"><span id="dot" class="dot"></span><span id="status">未录制</span></div><span id="timer" class="label"></span></div></section><section class="card"><div class="label">录制选项</div><div class="row"><label class="field"><input id="audio" type="checkbox"> 标签页音频</label><select id="privacy"><option value="safe">安全模式（推荐）</option><option value="raw">原始模式</option></select></div><p class="hint">只记录当前标签页，不包含麦克风和其他应用。</p></section><div class="actions"><button id="start" class="primary">开始录制</button><button id="stop" class="stop" hidden>结束录制</button><button id="preview" class="secondary" hidden>打开预览</button></div><div id="error" class="error"></div></main><script src="popup.js"></script></body></html>
