<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bug Lens</title>
  <style>
    :root {
      --primary: #165dff;
      --primary-hover: #3676ff;
      --danger: #f53f3f;
      --danger-hover: #f76565;
      --ink-main: #1d2129;
      --ink-sub: #4e5969;
      --ink-muted: #86909c;
      --border-subtle: rgba(0, 0, 0, 0.07);
      --bg-base: #ffffff;
      --radius-sm: 6px;
      --radius-md: 8px;
    }
    * { box-sizing: border-box; }
    body {
      width: 330px;
      margin: 0;
      color: var(--ink-main);
      background: var(--bg-base);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Segoe UI", Roboto, sans-serif;
      font-size: 12.5px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    .shell {
      padding: 14px 16px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    /* Navbar Headers */
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .brand img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }
    .brand h1 {
      font-size: 13.5px;
      font-weight: 600;
      margin: 0;
      color: var(--ink-main);
      letter-spacing: -0.2px;
    }
    .icon-tab-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--ink-sub);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .icon-tab-btn:hover {
      background: rgba(0, 0, 0, 0.05);
      color: var(--ink-main);
    }
    .icon-tab-btn.active {
      color: var(--primary);
      background: rgba(22, 93, 255, 0.08);
    }

    /* History Specific Header Bar */
    .history-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-main);
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
      transition: color 0.15s ease;
    }
    .back-btn:hover {
      color: var(--primary);
    }
    .history-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .icon-action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border: none;
      background: transparent;
      color: var(--ink-sub);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .icon-action-btn:hover {
      background: rgba(0, 0, 0, 0.05);
      color: var(--ink-main);
    }

    /* Context Stream */
    .context-flow {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .context-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .target-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      line-height: 1.35;
    }
    .target-url {
      font-size: 11px;
      color: var(--ink-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      color: var(--ink-sub);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #c9cdd4;
      transition: all 0.2s ease;
    }
    .dot.rec {
      background: var(--danger);
      box-shadow: 0 0 0 3px rgba(245, 63, 63, 0.2);
      animation: pulse-dot 1.5s infinite;
    }
    @keyframes pulse-dot {
      0% { box-shadow: 0 0 0 0 rgba(245, 63, 63, 0.4); }
      70% { box-shadow: 0 0 0 5px rgba(245, 63, 63, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 63, 63, 0); }
    }
    #timer {
      font-weight: 600;
      color: var(--danger);
      font-family: ui-monospace, monospace;
      font-size: 11.5px;
    }
    .evidence {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }
    .chip {
      font-size: 10.5px;
      padding: 0;
      background: transparent;
      border: none;
      color: var(--ink-sub);
      font-weight: 400;
    }
    .chip.captured { background: transparent; color: var(--ink-sub); }
    .chip.partial { background: transparent; color: #d97706; font-weight: 500; }
    .chip.failed { background: transparent; color: #dc2626; font-weight: 500; }
    .chip.disabled { background: transparent; color: var(--ink-muted); opacity: 0.6; }

    /* Inline Config Control */
    .inline-config {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-subtle);
    }
    .config-text {
      font-size: 11px;
      color: var(--ink-muted);
    }
    .toggle-options-btn {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      border: none;
      background: transparent;
      color: var(--primary);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 3px;
    }
    .toggle-options-btn:hover {
      background: rgba(22, 93, 255, 0.08);
    }
    .toggle-options-btn svg {
      transition: transform 0.2s ease;
    }
    .toggle-options-btn.open svg {
      transform: rotate(180deg);
    }

    /* Advanced Panel */
    .advanced-panel {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
      animation: fade-down 0.15s ease-out;
    }
    @keyframes fade-down {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .scopes-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-bottom: 8px;
    }
    .scope-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--ink-sub);
      cursor: pointer;
      padding: 3px 5px;
      background: #f4f5f7;
      border-radius: 4px;
      border: 1px solid transparent;
      transition: all 0.12s ease;
    }
    .scope-chip:has(input:checked) {
      background: rgba(22, 93, 255, 0.06);
      color: var(--primary);
      border-color: rgba(22, 93, 255, 0.18);
      font-weight: 500;
    }
    .scope-chip input[type="checkbox"] {
      margin: 0;
      accent-color: var(--primary);
      width: 12px;
      height: 12px;
      cursor: pointer;
    }
    .privacy-select {
      width: 100%;
      height: 25px;
      padding: 0 6px;
      font-size: 11px;
      color: var(--ink-main);
      background: #f4f5f7;
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    /* Shutter Action Button */
    .actions {
      margin-top: 4px;
    }
    button.action-btn {
      width: 100%;
      height: 38px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      letter-spacing: 0.2px;
    }
    button.action-btn.start {
      background: linear-gradient(135deg, #165dff 0%, #0e42d2 100%);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(22, 93, 255, 0.25);
    }
    button.action-btn.start:hover {
      background: linear-gradient(135deg, #3676ff 0%, #165dff 100%);
      box-shadow: 0 4px 12px rgba(22, 93, 255, 0.35);
      transform: translateY(-1px);
    }
    button.action-btn.stop {
      background: var(--danger);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(245, 63, 63, 0.25);
    }
    button.action-btn.stop:hover {
      background: var(--danger-hover);
    }
    button.action-btn.secondary {
      background: rgba(22, 93, 255, 0.08);
      color: var(--primary);
    }
    button.action-btn.secondary:hover {
      background: rgba(22, 93, 255, 0.15);
    }

    /* Search Wrapper */
    .search-wrapper {
      position: relative;
      margin-bottom: 8px;
    }
    .search-icon {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ink-muted);
      pointer-events: none;
    }
    input[type=search] {
      width: 100%;
      height: 28px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0 8px 0 26px;
      font: inherit;
      font-size: 11.5px;
      background: #f4f5f7;
      color: var(--ink-main);
      outline: none;
      transition: all 0.15s ease;
    }
    input[type=search]:focus {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(22, 93, 255, 0.1);
    }

    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 12px;
      color: var(--ink-muted);
      text-align: center;
    }
    .empty-state svg {
      opacity: 0.35;
      margin-bottom: 6px;
      color: var(--ink-sub);
    }
    .empty-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-sub);
      margin-bottom: 2px;
    }
    .empty-sub {
      font-size: 10.5px;
      color: var(--ink-muted);
    }

    /* History Session List */
    .sessions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
    }
    .session {
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      background: #ffffff;
      transition: border-color 0.15s ease;
    }
    .session:hover {
      border-color: rgba(22, 93, 255, 0.3);
    }
    .session-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .session-title { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--ink-main); }
    .session-head-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .btn-open-preview {
      border: 1px solid rgba(22, 93, 255, 0.18);
      padding: 2px 8px;
      border-radius: 4px;
      color: var(--primary);
      background: rgba(22, 93, 255, 0.08);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .btn-open-preview:hover {
      background: rgba(22, 93, 255, 0.16);
      border-color: rgba(22, 93, 255, 0.3);
    }
    .btn-delete-icon {
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      color: var(--ink-muted);
      background: transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      padding: 0;
    }
    .btn-delete-icon:hover {
      background: rgba(245, 63, 63, 0.1);
      color: var(--danger);
    }
    .btn-continue-sm {
      border: none;
      padding: 2px 6px;
      border-radius: 4px;
      color: #d25f00;
      background: #fff1e8;
      cursor: pointer;
      font-size: 10.5px;
      font-weight: 500;
    }
    .session-status-tag { font-size: 10.5px; padding: 0; background: transparent; color: var(--ink-muted); font-weight: 400; display: inline-block; }
    .session-time { color: var(--ink-muted); font-size: 10.5px; }
    .session-meta { color: var(--ink-muted); font-size: 10.5px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Storage Footer Footprint */
    .storage-footer {
      font-size: 10.5px;
      color: var(--ink-muted);
      margin-top: 4px;
      text-align: center;
      line-height: 1.45;
    }
    .error { color: #d92d20; font-size: 11.5px; padding: 6px 8px; border: 1px solid #ffccc7; background: #fff1f0; border-radius: 4px; white-space: pre-wrap; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="shell">
    <!-- 动态主 Header (录制模式) -->
    <header id="main-header" class="brand">
      <div class="brand-left">
        <img src="icons/icon_idle.png" alt="Bug Lens">
        <h1>Bug Lens</h1>
      </div>
      <div class="header-actions">
        <button class="icon-action-btn tab" data-view="history" data-i18n-title="history" title="历史记录">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </button>
      </div>
    </header>

    <!-- 动态主 Header (历史记录模式) -->
    <header id="history-header" class="history-header-bar" hidden>
      <button class="back-btn tab" data-view="record" data-i18n-title="backToRecord" title="返回录制">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span data-i18n="history">历史记录</span>
      </button>
      <div class="history-actions">
        <button id="refresh-history" class="icon-action-btn" data-i18n-title="refreshList" title="刷新列表">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        </button>
        <button id="cleanup" class="icon-action-btn" data-i18n-title="cleanupExpired" title="清理过期记录">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </div>
    </header>

    <section id="record-view">
      <div class="context-flow">
        <div class="context-head">
          <div id="title" class="target-title" data-i18n="loading">正在读取…</div>
          <div class="status-badge">
            <span id="dot" class="dot"></span>
            <span id="status" data-i18n="notRecording">未录制</span>
            <span id="timer"></span>
          </div>
        </div>
        <div id="url" class="target-url"></div>
        <div id="evidence" class="evidence"></div>

        <div class="inline-config">
          <span class="config-text" data-i18n="defaultSafeCollection">默认 · 安全全量采集</span>
          <button id="toggle-options" class="toggle-options-btn">
            <span data-i18n="config">配置</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
        </div>

        <div id="advanced-options" class="advanced-panel" hidden>
          <div class="scopes-grid">
            <label class="scope-chip"><input id="video" type="checkbox" checked><span data-i18n="video">录像</span></label>
            <label class="scope-chip"><input id="audio" type="checkbox"><span data-i18n="audio">音频</span></label>
            <label class="scope-chip"><input id="screenshots" type="checkbox" checked><span data-i18n="clickScreenshots">点击截图</span></label>
            <label class="scope-chip"><input id="console" type="checkbox" checked><span data-i18n="console">Console</span></label>
            <label class="scope-chip"><input id="network" type="checkbox" checked><span data-i18n="network">Network</span></label>
            <label class="scope-chip"><input id="bodies" type="checkbox" checked><span data-i18n="responseBodies">响应正文</span></label>
          </div>
          <select id="privacy" class="privacy-select">
            <option value="safe" data-i18n="safeMode">安全模式（推荐脱敏）</option>
            <option value="raw" data-i18n="rawMode">原始模式（不脱敏）</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button id="start" class="action-btn start">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"></circle></svg>
          <span data-i18n="startRecording">开始录制</span>
        </button>
        <button id="stop" class="action-btn stop" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
          <span data-i18n="stopRecording">结束录制</span>
        </button>
        <button id="preview" class="action-btn secondary" hidden data-i18n="reopenPreview">重新打开预览</button>
      </div>
    </section>

    <section id="history-view" hidden>
      <div class="search-wrapper">
        <svg class="search-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input id="search" type="search" placeholder="搜索标题、URL、状态" data-i18n-ph="searchPlaceholder">
      </div>
      <div id="sessions" class="sessions"></div>
      <div class="storage-footer">
        <span id="storage-used" data-i18n="loading">正在读取…</span> · <span id="storage-count">0 个会话</span>
        <div id="storage-policy" style="display: none;"></div>
      </div>
    </section>

    <div id="error" class="error" hidden></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
