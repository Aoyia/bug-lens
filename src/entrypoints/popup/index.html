<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bug Lens</title>
  <style>
    :root { --blue:#165dff; --red:#f53f3f; --ink:#1d2129; --sub:#86909c; --line:#e5e6eb; --bg:#f7f8fa; --good:#00b42a; --warn:#ff7d00; }
    * { box-sizing:border-box; } body { width:380px; margin:0; color:var(--ink); background:var(--bg); font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .shell { padding:14px; } .brand,.tabs,.row,.status-line,.session-head,.storage { display:flex; align-items:center; }
    .brand { justify-content:space-between; margin-bottom:12px; } .brand-left { display:flex; align-items:center; gap:9px; } .brand img { width:30px; height:30px; } h1 { font-size:15px; margin:0; } .subtitle { color:var(--sub); font-size:11px; } .version { color:var(--blue); background:#e8f3ff; padding:2px 6px; border-radius:3px; font-size:11px; }
    .tabs { gap:4px; padding:3px; background:#eef0f3; border-radius:5px; margin-bottom:12px; } .tab { flex:1; border:0; border-radius:3px; padding:6px; background:transparent; color:#4e5969; cursor:pointer; } .tab.active { color:var(--blue); background:#fff; font-weight:600; box-shadow:0 1px 2px #00000012; }
    .card { border:1px solid var(--line); border-radius:6px; background:#fff; padding:12px; margin-bottom:10px; } .label { color:var(--sub); font-size:11px; font-weight:600; margin-bottom:4px; } .target { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; } .url { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--sub); font-size:11px; }
    .status-line { gap:6px; margin-top:8px; color:#4e5969; } .dot { width:7px; height:7px; border-radius:50%; background:#c9cdd4; } .dot.rec { background:var(--red); box-shadow:0 0 0 3px #f53f3f26; } #timer { margin-left:auto; color:var(--red); font:600 12px ui-monospace,monospace; }
    .scopes { display:grid; grid-template-columns:1fr 1fr; gap:7px; } .scope { display:flex; align-items:center; gap:6px; color:#4e5969; } input[type=checkbox] { accent-color:var(--blue); } .hint { color:var(--sub); font-size:11px; margin:8px 0 0; }
    select,input[type=search] { border:1px solid var(--line); border-radius:4px; padding:6px 8px; font:inherit; background:#fff; } select { width:100%; margin-top:9px; } input[type=search] { width:100%; margin-bottom:9px; }
    .evidence { display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; } .chip { border-radius:12px; padding:2px 7px; font-size:11px; background:#f2f3f5; color:#4e5969; } .chip.captured { background:#e8ffea; color:#008a1b; } .chip.partial,.chip.failed { background:#fff1e8; color:#d25f00; } .chip.redacted { background:#f2e8ff; color:#722ed1; } .chip.disabled { background:#f2f3f5; color:#86909c; }
    .actions { display:grid; gap:7px; } button.action { width:100%; border:0; border-radius:4px; padding:9px; color:#fff; background:var(--blue); cursor:pointer; font-weight:600; } button.stop { background:var(--red); } button.secondary { background:#e8f3ff; color:var(--blue); } button:disabled { opacity:.5; cursor:not-allowed; }
    .history-tools { display:flex; gap:7px; } .history-tools button { border:1px solid var(--line); background:#fff; border-radius:4px; padding:5px 7px; color:#4e5969; cursor:pointer; font-size:11px; }
    .sessions { display:grid; gap:7px; } .session { border:1px solid var(--line); border-radius:5px; padding:9px; background:#fff; } .session-head { gap:6px; } .session-title { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; flex:1; font-weight:600; } .session-time,.session-meta { color:var(--sub); font-size:11px; } .session-actions { display:flex; gap:5px; margin-top:7px; } .session-actions button { border:0; padding:4px 6px; border-radius:3px; color:var(--blue); background:#e8f3ff; cursor:pointer; font-size:11px; } .session-actions button.delete { color:#d92d20; background:#fff1f0; }
    .storage { justify-content:space-between; gap:8px; color:#4e5969; } .storage strong { color:var(--ink); } .empty { color:var(--sub); text-align:center; padding:18px; } .error { color:#d92d20; font-size:12px; padding:7px; border:1px solid #ffccc7; background:#fff1f0; border-radius:4px; margin-top:9px; white-space:pre-wrap; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main class="shell">
    <header class="brand"><div class="brand-left"><img src="icons/icon_idle.png" alt="Bug Lens"><div><h1>Bug Lens</h1><div class="subtitle">本地诊断证据</div></div></div><span class="version">v0.2</span></header>
    <nav class="tabs"><button class="tab active" data-view="record">录制</button><button class="tab" data-view="history">历史</button></nav>

    <section id="record-view">
      <div class="card"><div class="label">当前标签页</div><div id="title" class="target">正在读取…</div><div id="url" class="url"></div><div class="status-line"><span id="dot" class="dot"></span><span id="status">未录制</span><span id="timer"></span></div><div id="evidence" class="evidence"></div></div>
      <div class="card"><div class="label">采集范围</div><div class="scopes">
        <label class="scope"><input id="video" type="checkbox" checked>录像</label><label class="scope"><input id="audio" type="checkbox">标签页音频</label>
        <label class="scope"><input id="screenshots" type="checkbox" checked>点击截图</label><label class="scope"><input id="console" type="checkbox" checked>Console</label>
        <label class="scope"><input id="network" type="checkbox" checked>Network</label><label class="scope"><input id="bodies" type="checkbox" checked>Network 正文</label>
      </div><select id="privacy"><option value="safe">安全模式（推荐）</option><option value="raw">原始模式</option></select><p class="hint">录像使用平衡 WebM 码率；会话上限 512 MiB，响应正文上限 2 MiB，默认保留 14 天。</p></div>
      <div class="actions"><button id="start" class="action">开始录制</button><button id="stop" class="action stop" hidden>结束录制</button><button id="preview" class="action secondary" hidden>重新打开预览</button></div>
    </section>

    <section id="history-view" hidden><input id="search" type="search" placeholder="搜索标题、URL、状态"><div class="history-tools"><button id="refresh-history">刷新</button><button id="cleanup">清理已过期会话</button></div><div id="sessions" class="sessions"></div><div class="card storage"><div><div class="label">本地存储</div><strong id="storage-used">正在读取…</strong><div id="storage-policy" class="session-meta"></div></div><span id="storage-count" class="session-meta"></span></div></section>
    <div id="error" class="error" hidden></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
