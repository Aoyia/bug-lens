<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>录制预览 - Web Bug Recorder</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#182230;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1180px;margin:0 auto;padding:28px}.header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}.eyebrow{color:#1769e0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.header h1{margin:5px 0;font-size:28px}.muted{color:#667085}.actions,.panel-heading,.item-actions{display:flex;align-items:center;gap:8px}.panel-heading{justify-content:space-between;margin-bottom:14px}.panel-heading h2{margin:0!important}button{border:0;border-radius:9px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;background:#1769e0;color:#fff}button.secondary{background:#e8eef8;color:#175cd3}button.ghost{padding:6px 9px;background:#f2f4f7;color:#475467;font-size:12px}button.delete{padding:5px 8px;background:#fff1f0;color:#b42318;font-size:12px}button:disabled{opacity:.55;cursor:not-allowed}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:18px;box-shadow:0 4px 16px #1018280a}.card h2{font-size:16px;margin:0 0 14px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}.metric{background:#f8fafc;border-radius:9px;padding:12px}.metric strong{display:block;font-size:22px}.metric span{font-size:12px;color:#667085}.list{display:flex;flex-direction:column;gap:8px;max-height:480px;overflow:auto}.item{border:1px solid #e4e7ec;border-radius:10px;padding:11px;cursor:pointer}.item:hover{border-color:#84adf4}.item .top{display:flex;justify-content:space-between;gap:10px}.item .text{margin-top:5px;color:#344054}.badge{font-size:11px;padding:2px 7px;border-radius:999px;background:#ecfdf3;color:#027a48}.badge.partial{background:#fffaeb;color:#b54708}.detail{min-height:200px}.code{white-space:pre-wrap;word-break:break-word;background:#101828;color:#d0d5dd;border-radius:8px;padding:12px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:280px;overflow:auto}.shot{width:100%;max-height:360px;object-fit:contain;background:#f2f4f7;border-radius:8px;margin-top:10px}.video-card{margin-bottom:16px}.video{display:block;width:100%;max-height:520px;border-radius:10px;background:#101828}.empty{padding:25px;text-align:center;color:#98a2b3}@media(max-width:800px){.shell{padding:16px}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="shell"><header class="header"><div><div class="eyebrow">Web Bug Recorder</div><h1 id="title">录制预览</h1><div id="meta" class="muted"></div></div><div class="actions"><button id="export">导出离线报告</button></div></header><section id="metrics" class="metrics"></section><section class="card video-card"><h2>标签页录像</h2><div id="video-empty" class="empty">正在读取媒体分片…</div><video id="video" class="video" controls hidden></video></section><div class="grid"><section class="card"><div class="panel-heading"><h2>交互步骤</h2><button id="restore" class="ghost" hidden>恢复已删除步骤</button></div><div id="interactions" class="list"></div></section><section class="card detail"><h2>步骤详情</h2><div id="detail" class="empty">选择左侧步骤查看元素信息</div></section><section class="card"><h2>Console</h2><div id="console" class="list"></div></section><section class="card"><h2>Network</h2><div id="network" class="list"></div></section></div></main><script src="preview.js"></script></body></html>
