name: Release Native Rust Triage CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-matrix:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            bin: bug-lens-cli
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            bin: bug-lens-cli
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            bin: bug-lens-cli
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            archive: tar.gz
            bin: bug-lens-cli
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            bin: bug-lens-cli.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --manifest-path crates/bug-lens-cli/Cargo.toml --target ${{ matrix.target }}

      - name: Package release archive (POSIX)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p release-assets
          tar -czf "release-assets/bug-lens-cli-${{ matrix.target }}.tar.gz" \
            -C "crates/bug-lens-cli/target/${{ matrix.target }}/release" "${{ matrix.bin }}"

      - name: Package release archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive -Path "crates/bug-lens-cli/target/${{ matrix.target }}/release/${{ matrix.bin }}" `
            -DestinationPath "release-assets/bug-lens-cli-${{ matrix.target }}.zip" -Force

      - name: Upload target artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: release-assets/

  publish-release-assets:
    name: Generate SHA256SUMS & Attach to Release
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Download all target artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: all-assets
        run: |
          sha256sum bug-lens-cli-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload combined bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bug-lens-cli-release-assets
          path: all-assets/

      - name: Attach assets to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Bug Lens $TAG" --generate-notes || gh release view "$TAG" >/dev/null 2>&1
          fi
          gh release upload "$TAG" all-assets/* --clobber
