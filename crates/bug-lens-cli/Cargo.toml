[package]
name = "bug-lens-cli"
version = "0.7.44"
edition = "2021"
license = "AGPL-3.0-only"
description = "Native Rust CLI for Bug Lens evidence pack extraction, integrity verification, and triage queries."

[[bin]]
name = "bug-lens-cli"
path = "src/main.rs"

[lib]
name = "bug_lens_cli"
path = "src/lib.rs"

[dependencies]
indexmap = { version = "2", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
